<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 담당자 조회 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f7fa;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
        }
        /* 엑셀 데이터 등록 영역 */
        .admin-section {
            margin-bottom: 25px;
            padding: 12px;
            background-color: #f8f9fa;
            border: 1px dashed #ced4da;
            border-radius: 6px;
            font-size: 14px;
            color: #6c757d;
        }
        .admin-section input {
            margin-top: 8px;
        }
        /* 검색 창 영역 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-box input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #4a90e2;
        }
        .search-box button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #4a90e2;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-box button:hover {
            background-color: #357abd;
        }
        /* 결과 출력 영역 */
        .result-card {
            display: none;
            border-top: 2px solid #e9ecef;
            padding-top: 20px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        .result-label {
            font-weight: 600;
            color: #495057;
            width: 130px;
        }
        .result-value {
            color: #212529;
            flex: 1;
            text-align: right;
        }
        .no-data {
            text-align: center;
            color: #e03131;
            font-weight: 500;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
