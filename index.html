<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wilo.material.search</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* 첫 화면: 검색 폼 레이아웃 */
        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #0056b3;
        }

        .search-box button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #0056b3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .search-box button:hover {
            background-color: #003d80;
        }

        /* 결과 정보 출력 창 */
        .result-box {
            margin-top: 25px;
            display: none;
            border-top: 2px solid #edf2f7;
            padding-top: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
            font-size: 15px;
        }

        .result-item .label {
            font-weight: 600;
            color: #4a5568;
            width: 40%;
        }

        .result-item .value {
            color: #1a202c;
            width: 60%;
            text-align: right;
            word-break: break-all;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            color: #e53e3e;
            font-weight: 500;
        }

        /* PC / 모바일 반응형 커스텀 스타일 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .container {
                padding: 20px;
                border-radius: 8px;
            }

            .search-box input {
                padding: 12px;
                font-size: 15px;
            }

            .search-box button {
                padding: 12px 18px;
                font-size: 15px;
            }

            .result-item {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input type="text" id="partNumberInput" placeholder="품번을 입력하세요" onkeypress="handleKeyPress(event)">
        <button onclick="searchMaterial()">조회</button>
    </div>

    <div id="message" class="message"></div>

    <div id="resultBox" class="result-box">
        <div class="result-item"><span class="label">품번</span><span class="value" id="resPartNo"></span></div>
        <div class="result-item"><span class="label">자재명</span><span class="value" id="resName"></span></div>
        <div class="result-item"><span class="label">업체</span><span class="value" id="resVendor"></span></div>
        <div class="result-item"><span class="label">자재반 담당자</span><span class="value" id="resOperator"></span></div>
        <div class="result-item"><span class="label">자재팀 담당자</span><span class="value" id="resManager"></span></div>
    </div>
</div>

<script>
    // 엑셀 파일 경로 지정 (같은 폴더 위치의 materials.xlsx)
    const EXCEL_FILE_PATH = './materials.xlsx';

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            searchMaterial();
        }
    }

    async function searchMaterial() {
        const inputVal = document.getElementById('partNumberInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const messageDiv = document.getElementById('message');

        resultBox.style.display = 'none';
        messageDiv.innerText = '';

        if (!inputVal) {
            messageDiv.innerText = '품번을 입력해주세요.';
            return;
        }

        try {
            // 엑셀 파일 로드 (매달 엑셀 파일만 교체하면 새로 불러옴)
            const response = await fetch(EXCEL_FILE_PATH + '?v=' + new Date().getTime());
            if (!response.ok) throw new Error('엑셀 파일을 찾을 수 없습니다.');
            
            const data = await response.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            
            // 첫 번째 시트 사용
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // JSON 변환
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            // 입력된 품번 검색 (대소문자 및 공백 무시)
            const matchedData = jsonData.find(row => 
                row['품번'] && String(row['품번']).trim().toLowerCase() === inputVal.toLowerCase()
            );

            if (matchedData) {
                document.getElementById('resPartNo').innerText = matchedData['품번'] || '-';
                document.getElementById('resName').innerText = matchedData['자재명'] || '-';
                document.getElementById('resVendor').innerText = matchedData['업체'] || '-';
                document.getElementById('resOperator').innerText = matchedData['자재반 담당자'] || '-';
                document.getElementById('resManager').innerText = matchedData['자재팀 담당자'] || '-';
                resultBox.style.display = 'block';
            } else {
                messageDiv.innerText = '일치하는 자재 정보를 찾을 수 없습니다.';
            }

        } catch (error) {
            console.error(error);
            messageDiv.innerText = '데이터를 불러오는 중 오류가 발생했습니다. (엑셀 파일 확인 필요)';
        }
    }
</script>

</body>
</html>
