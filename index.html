<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 담당자 조회 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f6f8;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }
        .status-box {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 6px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 14px 28px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            display: none; /* 초기 숨김 */
        }
        .result-table th, .result-table td {
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            text-align: left;
            font-size: 15px;
        }
        .result-table th {
            background-color: #f8f9fa;
            color: #495057;
            width: 35%;
        }
        .result-table td {
            color: #212529;
            font-weight: bold;
        }
        .no-result {
            color: #dc3545;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>자재 담당자 조회</h1>

    <div class="status-box" id="statusMsg">🔄 DB(엑셀 데이터)를 로딩 중입니다...</div>

    <div class="search-box">
        <input type="text" id="partNumberInput" placeholder="품번(자재번호)을 입력하세요" onkeyup="handleKeyPress(event)" disabled>
        <button id="searchBtn" onclick="searchMaterial()" disabled>조회</button>
    </div>

    <table class="result-table" id="resultTable">
        <tr>
            <th>품번</th>
            <td id="resPartNo">-</td>
        </tr>
        <tr>
            <th>자재명</th>
            <td id="resPartName">-</td>
        </tr>
        <tr>
            <th>업체</th>
            <td id="resCompany">-</td>
        </tr>
        <tr>
            <th>자재반 담당자</th>
            <td id="resClassManager">-</td>
        </tr>
        <tr>
            <th>자재팀 담당자</th>
            <td id="resTeamManager">-</td>
        </tr>
    </table>

    <div class="no-result" id="noResultMsg">해당 품번의 자재 정보를 찾을 수 없습니다.</div>
</div>

<script>
    // =========================================================
    // GitHub에 함께 올려둘 엑셀 파일명입니다.
    // index.html과 같은 위치에 'materials.xlsx' 이름으로 올리면 됩니다.
    // =========================================================
    const EXCEL_FILE_URL = './materials.xlsx';

    let materialDB = [];

    // 페이지가 열리면 자동으로 엑셀 파일 불러오기
    window.onload = function() {
        fetchExcelData();
    };

    // GitHub 서버에서 엑셀 파일 가져오는 함수
    function fetchExcelData() {
        const statusMsg = document.getElementById('statusMsg');
        const input = document.getElementById('partNumberInput');
        const btn = document.getElementById('searchBtn');

        // 캐시(임시저장)를 방지하여 항상 최신 엑셀을 불러오도록 함
        fetch(EXCEL_FILE_URL + '?v=' + new Date().getTime())
            .then(response => {
                if (!response.ok) {
                    throw new Error("엑셀 파일을 찾을 수 없습니다.");
                }
                return response.arrayBuffer();
            })
            .then(data => {
                const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // 엑셀 시트 내용을 JSON 데이터로 변환
                materialDB = XLSX.utils.sheet_to_json(worksheet);

                statusMsg.innerText = "🟢 자재 DB 준비 완료 (총 " + materialDB.length + "건)";
                statusMsg.style.color = "#28a745";
                
                // 입력창과 버튼 활성화
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            })
            .catch(error => {
                console.error(error);
                statusMsg.innerText = "🔴 자재 엑셀 파일(materials.xlsx)을 로드하지 못했습니다.";
                statusMsg.style.color = "#dc3545";
            });
    }

    // 엔터키 입력 처리
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            searchMaterial();
        }
    }

    // 자재 조회 로직
    function searchMaterial() {
        const inputVal = document.getElementById('partNumberInput').value.trim();
        const table = document.getElementById('resultTable');
        const noResult = document.getElementById('noResultMsg');

        if (!inputVal) {
            alert("품번을 입력해주세요.");
            return;
        }

        if (materialDB.length === 0) {
            alert("데이터를 로딩 중입니다. 잠시만 기다려주세요.");
            return;
        }

        // 품번 검색 (엑셀 헤더명: 품번, 자재명, 업체, 자재반담당자, 자재팀담당자)
        const found = materialDB.find(item => 
            String(item['품번'] || '').toLowerCase() === inputVal.toLowerCase()
        );

        if (found) {
            document.getElementById('resPartNo').innerText = found['품번'] || '-';
            document.getElementById('resPartName').innerText = found['자재명'] || '-';
            document.getElementById('resCompany').innerText = found['업체'] || '-';
            document.getElementById('resClassManager').innerText = found['자재반 담당자'] || found['자재반담당자'] || '-';
            document.getElementById('resTeamManager').innerText = found['자재팀 담당자'] || found['자재팀담당자'] || '-';

            table.style.display = 'table';
            noResult.style.display = 'none';
        } else {
            table.style.display = 'none';
            noResult.style.display = 'block';
        }
    }
</script>

</body>
</html>
